<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ với Google Maps</title>
    <style>
        /* Đặt kích thước cho bản đồ */
        #map {
            height: 400px; /* chiều cao của bản đồ */
            width: 100%;   /* chiều rộng của bản đồ */
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="zigzag-top"></div> <!-- Ảnh răng cưa trên -->
        
        <div class="background-image">
            <div class="overlay-content">
                <h2>Last Minute!</h2>
                <h1>Incredible! Are you coming today</h1>
                <div class="countdown">
                    <div>
                        <span>00</span>
                        <p>Days</p>
                    </div>
                    <div>
                        <span>00</span>
                        <p>Hours</p>
                    </div>
                    <div>
                        <span>00</span>
                        <p>Minutes</p>
                    </div>
                    <div>
                        <span>00</span>
                        <p>Seconds</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="zigzag-bottom"></div> <!-- Ảnh răng cưa dưới -->
    </div>

</body>
</html>
